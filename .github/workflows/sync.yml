name: Sync ldeff solutions

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch solutions
        env:
          CLERK_CLIENT: ${{ secrets.CLERK_CLIENT }}
        run: node scripts/sync.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A sql dataframe README.md 2>/dev/null || git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "sync: solutions from ldeff ($(date -u +%Y-%m-%d))"
            git push
          fi
